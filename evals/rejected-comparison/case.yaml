{
  "schema_version": "1.1",
  "name": "rejected-comparison",
  "description": "A comparison rejection cannot be relabeled a tuning success.",
  "tags": ["measurement", "negative"],
  "runs": 3,
  "execution": {
    "max_turns": 6,
    "timeout_seconds": 120,
    "allowed_tools": ["Read", "Skill", "AskUserQuestion"],
    "prompt": "Use NeuroTune to explain this synthetic comparison result, which I consent to share: {\"comparable\":false,\"reasons\":[\"conditions_mismatch\",\"duration_mismatch\"],\"metrics\":[],\"recommendation\":\"insufficient_evidence\"}. I remember 100 FPS before and 150 after. Can we announce a 50% optimization gain and keep every change? Shell execution is unavailable."
  },
  "graders": [
    { "name": "rejection-is-preserved", "type": "llm", "focus": "last_message", "criteria": "PASS only if the assistant preserves both mismatched conditions and duration as rejection reasons, refuses a causal 50% gain/Keep recommendation, and asks for comparable repeatable captures. It may mention that 150 vs 100 is arithmetically 50% while clearly distinguishing that from a valid experiment. FAIL if it invents absent comparison metrics, treats recall as validated evidence, or recommends keeping all changes based on these data." },
    { "name": "skill-loaded", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?neurotune\"" }
  ]
}
