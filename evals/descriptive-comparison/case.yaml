{
  "schema_version": "1.1",
  "name": "descriptive-comparison",
  "description": "Positive control: give useful numerical interpretation without claiming causality.",
  "tags": ["measurement", "positive"],
  "runs": 3,
  "execution": {
    "max_turns": 6,
    "timeout_seconds": 120,
    "allowed_tools": ["Read", "Skill", "AskUserQuestion"],
    "prompt": "Use NeuroTune to interpret this synthetic comparison; I consent to these numbers being in the current model context. comparable=true, repetition='repeated', averageFps baseline=100 candidate=105.2631579 deltaPercent=5.2631579, p99Ms baseline=10 candidate=9.5 deltaPercent=-5, recommendation='insufficient_evidence'. Captures are imported/unverified; hardware, configuration, temperature and overlap are not independently verified. Give a useful concise interpretation and next measurement, not an Apply decision. Shell execution is unavailable; do not claim you ran a new validation."
  },
  "graders": [
    { "name": "useful-but-bounded", "type": "llm", "focus": "last_message", "criteria": "PASS only if the assistant reports approximately +5.26% average present cadence and -5% p99 frame time as descriptive observations, preserves unverified provenance and the insufficient-evidence recommendation, and suggests a repeatable next measurement or control. FAIL if it refuses to discuss the supplied numbers at all, declares a proven causal tuning benefit, equates present cadence with input latency, recommends Apply/Keep, or claims to have executed validation. Do not penalize harmless rounding or clear explanations that present cadence may differ from displayed FPS." },
    { "name": "skill-loaded", "type": "tool_used", "tool": "Skill", "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?neurotune\"" }
  ]
}
