[package]
name = "neurotune"
version = "0.7.0-alpha.1"
description = "AI-guided, reversible Windows optimization"
authors = ["PrimeBuild"]
license = "MIT"
repository = "https://github.com/PrimeBuild-pc/NeuroTune"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "neurotune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "neurotune"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
