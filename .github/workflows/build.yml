name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt

      - run: npm ci --ignore-scripts
        working-directory: ui
      - name: Bundle the default Pi agent and Node runtime
        run: npm run pi:build
        working-directory: ui
      - run: dotnet restore
      - run: dotnet format NeuroTune.sln --verify-no-changes --no-restore
      - run: dotnet build --configuration Release --no-restore
      - name: Let non-admin test helpers read the build output
        # Files written by the elevated runner are owned by Administrators; helpers run with that group deny-only.
        run: icacls tests\NeuroTune.Tests\bin /grant "${env:USERNAME}:(OI)(CI)RX" /T /Q
      - run: dotnet test --configuration Release --no-build --blame-hang-timeout 10m
      - name: Block known NuGet vulnerabilities (including transitive packages)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = & dotnet list NeuroTune.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet vulnerability listing failed.' }
          $report = ($raw -join "`n") | ConvertFrom-Json
          if ($report.version -ne 1 -or -not $report.projects -or $report.problems) { throw 'Unexpected or incomplete NuGet audit report.' }
          $vulnerable = @($report.projects | ForEach-Object { $_.frameworks } |
            ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
            Where-Object { $_.vulnerabilities })
          if ($vulnerable.Count) {
            $vulnerable | Select-Object id, resolvedVersion | Format-Table
            throw 'Known vulnerable NuGet dependencies block this build.'
          }
      - name: Verify MIT and release metadata
        shell: pwsh
        run: ./scripts/test-release-metadata.ps1
      - name: Publish Tauri agent resources
        run: npm run agent:publish
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm audit --audit-level=high
        working-directory: ui
      - run: cargo fmt --check
        working-directory: ui/src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: ui/src-tauri
      - run: cargo test
        working-directory: ui/src-tauri
      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
        working-directory: ui/src-tauri
      - name: Build Tauri installer
        working-directory: ui
        run: npm run tauri -- build --bundles nsis

      - name: Create installer, portable ZIP, and checksums
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NeuroTune-win-x64
          if-no-files-found: error
          path: artifacts/release/*
