name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/NeuroTune/NeuroTune.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/NeuroTune
          Compress-Archive -Path artifacts/NeuroTune/* -DestinationPath artifacts/NeuroTune-win-x64.zip
          (Get-FileHash artifacts/NeuroTune-win-x64.zip -Algorithm SHA256).Hash | Set-Content artifacts/NeuroTune-win-x64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: NeuroTune-win-x64
          path: |
            artifacts/NeuroTune-win-x64.zip
            artifacts/NeuroTune-win-x64.zip.sha256
