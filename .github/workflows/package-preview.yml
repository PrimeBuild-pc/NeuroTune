name: Package beta candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'PrimeBuild-pc/NeuroTune' && github.ref == 'refs/heads/main' && github.actor_id == '162145141'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify version and package the tested archive
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(node -p 'require("./package.json").version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          mkdir "$RUNNER_TEMP/neurotune-package"
          npm run test:package -- "$RUNNER_TEMP/neurotune-package"
          cd "$RUNNER_TEMP/neurotune-package"
          sha256sum -- "neurotune-skill-$version.tgz" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          printf 'Beta candidate %s built from `%s`.\n' "$version" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neurotune-beta-${{ github.sha }}
          path: ${{ runner.temp }}/neurotune-package/
          if-no-files-found: error
