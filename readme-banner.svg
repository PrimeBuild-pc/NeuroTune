    <linearGradient id="band" x2="0" y2="1"><stop stop-color="#283041"/><stop offset=".08" stop-color="#1b2230"/><stop offset="1" stop-color="#10141c"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#9388ff" stop-opacity=".22"/><stop offset="1" stop-color="#9388ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#surface)"/>
