<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">NeuroTune — AI-powered Windows 11 optimizer. Free and open source.</title>
  <desc id="desc">The current purple and white NeuroTune N app icon, prominently beside the wordmark. Evidence, intelligence and local control. Measure first, choose your AI and review every change. MIT licensed; unsigned alpha.</desc>
